name: Build iOS Libretro Cores

# Builds libretro cores for iOS (device + simulator arm64, minos 15.0) from
# native/agents/gemini-argon/ios-cores/cores.lock.json, wraps them into signed-ready
# XCFrameworks, and publishes them to the repo's GitHub Release ios-cores-<LOCKHASH>.
# Owner: gemini-argon (WP0).

on:
  workflow_dispatch:
    inputs:
      cores:
        description: "JSON list of cores to build (default: all keys of cores.lock.json)"
        required: false
        default: ""
        type: string
      publish:
        description: "Publish built XCFrameworks to GitHub Release ios-cores-<LOCKHASH>"
        required: false
        default: true
        type: boolean
      force_republish:
        description: "Overwrite existing <core>.xcframework.zip assets in ios-cores-<LOCKHASH>"
        required: false
        default: false
        type: boolean
      validate_only:
        description: "Skip building/publishing and only run validate-release on current release zips"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ios-cores-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      cores: ${{ steps.meta.outputs.cores }}
      lockhash: ${{ steps.meta.outputs.lockhash }}
      publish: ${{ steps.meta.outputs.publish }}
      force_republish: ${{ steps.meta.outputs.force_republish }}
      validate_only: ${{ steps.meta.outputs.validate_only }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute lockhash and core matrix
        id: meta
        env:
          INPUT_CORES: ${{ inputs.cores }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_FORCE_REPUBLISH: ${{ inputs.force_republish }}
          INPUT_VALIDATE_ONLY: ${{ inputs.validate_only }}
        run: |
          LOCK="native/agents/gemini-argon/ios-cores/cores.lock.json"
          LOCKHASH=$(shasum -a 256 "$LOCK" | cut -c1-12)
          echo "lockhash=$LOCKHASH" >> "$GITHUB_OUTPUT"
          echo "LOCKHASH=$LOCKHASH"

          CORES=$(python3 - "$LOCK" "$INPUT_CORES" <<'PY'
          import json, sys
          lock_path, raw = sys.argv[1], sys.argv[2].strip()
          with open(lock_path, "r", encoding="utf-8") as f:
              lock = json.load(f)
          if not raw or raw == "all":
              cores = list(lock.keys())
          else:
              cores = json.loads(raw)
              if not isinstance(cores, list) or not cores:
                  raise SystemExit("inputs.cores must be a non-empty JSON list")
              for c in cores:
                  if c not in lock:
                      raise SystemExit(f"Unknown core in inputs.cores: {c}")
          print(json.dumps(cores))
          PY
          )
          echo "cores=$CORES" >> "$GITHUB_OUTPUT"
          echo "CORES=$CORES"

          if [ "$INPUT_PUBLISH" = "false" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

          if [ "$INPUT_FORCE_REPUBLISH" = "true" ]; then
            echo "force_republish=true" >> "$GITHUB_OUTPUT"
          else
            echo "force_republish=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$INPUT_VALIDATE_ONLY" = "true" ]; then
            echo "validate_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "validate_only=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.validate_only != 'true'
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        core: ${{ fromJson(needs.prepare.outputs.cores) }}
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Build device and simulator slices
        run: |
          CORE="${{ matrix.core }}"
          SCRIPTS="native/agents/gemini-argon/ios-cores"
          bash "$SCRIPTS/build-core.sh" "$CORE" device "$RUNNER_TEMP/slices/$CORE/device"
          bash "$SCRIPTS/build-core.sh" "$CORE" simulator "$RUNNER_TEMP/slices/$CORE/simulator"
          bash "$SCRIPTS/make-framework.sh" "$CORE" \
            "$RUNNER_TEMP/slices/$CORE/device/${CORE}.dylib" \
            "$RUNNER_TEMP/slices/$CORE/simulator/${CORE}.dylib" \
            "$RUNNER_TEMP/dist/$CORE"
      - name: Upload core artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-core-${{ matrix.core }}
          path: |
            ${{ runner.temp }}/dist/${{ matrix.core }}/${{ matrix.core }}.xcframework.zip
            ${{ runner.temp }}/dist/${{ matrix.core }}/checksums.txt
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.validate_only != 'true' && needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download built core artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ios-core-*
          path: ${{ runner.temp }}/artifacts
      - name: Assemble release assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          LOCKHASH: ${{ needs.prepare.outputs.lockhash }}
          FORCE_REPUBLISH: ${{ needs.prepare.outputs.force_republish }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          find "$RUNNER_TEMP/artifacts" -name '*.xcframework.zip' -exec cp {} "$RUNNER_TEMP/release/" \;
          find "$RUNNER_TEMP/artifacts" -name 'checksums.txt' -exec cat {} + | sort -u > "$RUNNER_TEMP/release/checksums.txt"

          TAG="ios-cores-$LOCKHASH"
          echo "=== Release tag: $TAG (force_republish=$FORCE_REPUBLISH) ==="

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "$RUNNER_TEMP/release"/*.xcframework.zip "$RUNNER_TEMP/release/checksums.txt" \
              --target "${{ github.sha }}" \
              --title "$TAG" \
              --notes "Prebuilt iOS (arm64 device + simulator, minos 15.0) libretro core XCFrameworks for cores.lock.json ($LOCKHASH)."
          else
            EXISTING="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            CHANGED=0
            for z in "$RUNNER_TEMP/release"/*.xcframework.zip; do
              NAME="$(basename "$z")"
              if [ "$FORCE_REPUBLISH" = "true" ]; then
                echo "Uploading $NAME (force_republish=true)..."
                gh release upload "$TAG" "$z" --clobber
                CHANGED=1
              elif printf '%s\n' "$EXISTING" | grep -Fxq "$NAME"; then
                echo "$NAME: already published, keeping"
              else
                echo "Uploading new core asset $NAME..."
                gh release upload "$TAG" "$z"
                CHANGED=1
              fi
            done

            if [ "$CHANGED" -eq 1 ] || ! printf '%s\n' "$EXISTING" | grep -Fxq "checksums.txt"; then
              mkdir -p "$RUNNER_TEMP/release-zips"
              gh release download "$TAG" -p '*.xcframework.zip' -D "$RUNNER_TEMP/release-zips"
              (
                cd "$RUNNER_TEMP/release-zips"
                shasum -a 256 *.xcframework.zip | sort -k2 > "$RUNNER_TEMP/release/checksums.txt"
              )
              gh release upload "$TAG" "$RUNNER_TEMP/release/checksums.txt" --clobber
            else
              echo "checksums.txt: already published, keeping"
              gh release download "$TAG" -p 'checksums.txt' -D "$RUNNER_TEMP/release" --clobber
            fi
          fi

          echo "=== checksums.txt in release $TAG ==="
          cat "$RUNNER_TEMP/release/checksums.txt"

          {
            echo "### iOS Cores Release \`$TAG\`"
            echo ""
            echo "\`\`\`"
            cat "$RUNNER_TEMP/release/checksums.txt"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload combined release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-cores-${{ needs.prepare.outputs.lockhash }}
          path: |
            ${{ runner.temp }}/release/*.xcframework.zip
            ${{ runner.temp }}/release/checksums.txt
          if-no-files-found: error

  validate-release:
    needs: [prepare, publish]
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      (needs.prepare.outputs.validate_only == 'true' || needs.publish.result == 'success')
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Download release zips and validate each device framework slice
        env:
          GH_TOKEN: ${{ github.token }}
          LOCKHASH: ${{ needs.prepare.outputs.lockhash }}
          CORES_JSON: ${{ needs.prepare.outputs.cores }}
        run: |
          TAG="ios-cores-$LOCKHASH"
          echo "=== Validating release $TAG ==="
          mkdir -p "$RUNNER_TEMP/validate-zips" "$RUNNER_TEMP/validate-unpacked"
          gh release download "$TAG" -p '*.xcframework.zip' -D "$RUNNER_TEMP/validate-zips"

          VALIDATOR="native/agents/gemini-argon/ci/gemini-3.8-flash-high/validate-ipa.sh"
          chmod +x "$VALIDATOR"

          CORES_LIST=$(python3 -c 'import json, os; print(" ".join(json.loads(os.environ["CORES_JSON"])))')
          for CORE in $CORES_LIST; do
            ZIP="$RUNNER_TEMP/validate-zips/${CORE}.xcframework.zip"
            if [ ! -f "$ZIP" ]; then
              echo "ERROR: Missing release zip $ZIP" >&2
              exit 1
            fi
            UNPACK_DIR="$RUNNER_TEMP/validate-unpacked/$CORE"
            mkdir -p "$UNPACK_DIR"
            ditto -x -k "$ZIP" "$UNPACK_DIR"

            DEVICE_FW="$UNPACK_DIR/${CORE}.xcframework/ios-arm64/${CORE}.framework"
            if [ ! -d "$DEVICE_FW" ]; then
              echo "ERROR: Device framework slice not found at $DEVICE_FW" >&2
              exit 1
            fi

            echo "--- Validating $CORE ($DEVICE_FW) ---"
            bash "$VALIDATOR" --framework "$DEVICE_FW"
          done
