name: Build GPL cores

# Builds libretro cores whose licenses allow commercial (ad-supported) distribution and that the
# EmulatorJS npm packages do not ship: Mesen-S (SNES, GPLv3), Gearsystem (SMS/Game Gear, GPLv3),
# clownmdemu (Mega Drive, AGPLv3). Uses the official EmulatorJS build scripts and commits the
# resulting .data files to cores/dist on the default branch.

on:
  workflow_dispatch:
    inputs:
      cores:
        description: JSON list of cores to build (default all)
        required: false
      emsdk:
        description: Emscripten version (default 3.1.74)
        required: false
      retroarch:
        description: EmulatorJS RetroArch commit (default a61f8a8905)
        required: false
      publish:
        description: Commit the built cores to cores/dist (set false for test builds)
        required: false
        default: "true"
  push:
    branches: [main]
    paths: [.github/workflows/build-cores.yml, cores/extra-cores.json]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core: ${{ fromJSON(inputs.cores || '["mesen-s", "gearsystem", "clownmdemu"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y jq p7zip-full binutils-mips-linux-gnu build-essential pkgconf python3 zip libsdl2-dev
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ inputs.emsdk || '3.1.74' }}
      # The app ships EmulatorJS 4.2.3. Newer build scripts and RetroArch (May 2026+) produce cores
      # that require EmulatorJS 4.3.0, so pin both to the last 4.2.x-compatible revisions:
      # build scripts 6c0dc2e (minimumEJSVersion 4.2.2), RetroArch `next` at a61f8a8905 (its head from Oct 2025 to Feb 2026).
      # build.sh then finds RetroArch/EmulatorJS already cloned; its `git pull` on a detached HEAD
      # fails harmlessly and leaves the pinned commits in place.
      - name: Get EmulatorJS build scripts
        run: |
          git clone https://github.com/EmulatorJS/build.git ejs-build
          git -C ejs-build checkout 6c0dc2e
          mkdir -p ejs-build/compile
          git clone -b next https://github.com/EmulatorJS/RetroArch.git ejs-build/compile/RetroArch
          git -C ejs-build/compile/RetroArch checkout ${{ inputs.retroarch || 'a61f8a8905' }}
          git clone -b v4.2.3 --depth 1 https://github.com/EmulatorJS/EmulatorJS.git ejs-build/compile/RetroArch/EmulatorJS
          git -C ejs-build/compile/RetroArch/EmulatorJS checkout --detach
          jq -s '.[0] + .[1]' ejs-build/cores.json cores/extra-cores.json > ejs-build/cores.merged.json
          mv ejs-build/cores.merged.json ejs-build/cores.json
      # Mesen-S bundles its own copy of the 7-Zip SDK, which clashes with RetroArch's when the core
      # is linked into the frontend. Prefix every symbol of Mesen-S's copy; build.sh then finds the
      # patched checkout already cloned.
      - name: Rename Mesen-S's 7-Zip symbols
        if: matrix.core == 'mesen-s'
        working-directory: ejs-build/compile
        run: |
          git clone --depth 1 https://github.com/libretro/Mesen-S.git mesen-s
          cd mesen-s/SevenZip
          mkdir -p /tmp/7z
          for f in *.c; do emcc -c -D LIBRETRO "$f" -o "/tmp/7z/${f%.c}.o"; done
          "$(dirname "$(which emcc)")/../bin/llvm-nm" --defined-only --extern-only /tmp/7z/*.o \
            | awk 'NF == 3 { print $3 }' | sort -u | awk '{ print "#define " $1 " mesens_" $1 }' > mesens-7z-rename.h
          wc -l mesens-7z-rename.h
          cd ../Libretro
          sed -i 's|^CFLAGS   += -D LIBRETRO $(fpic)|& -include $(CURDIR)/../SevenZip/mesens-7z-rename.h|; s|^CXXFLAGS += -D LIBRETRO $(fpic) -std=c++11|& -include $(CURDIR)/../SevenZip/mesens-7z-rename.h|' Makefile
          grep -c mesens-7z-rename Makefile | grep -qx 2
      # Supafaust renders the PPU on a second thread by default; the web build has no threads,
      # so make the single-threaded renderer and "no affinity" the defaults.
      - name: Single-threaded Supafaust
        if: matrix.core == 'supafaust'
        working-directory: ejs-build/compile
        run: |
          git clone --depth 1 https://github.com/libretro/supafaust.git supafaust
          cd supafaust
          sed -i 's/"PPU renderer; mt|st"/"PPU renderer; st|mt"/; s/affinity mask; 0x2|0x0|/affinity mask; 0x0|0x2|/; s/affinity mask; 0x1|0x0|/affinity mask; 0x0|0x1|/' libretro.cpp
          grep -c '"PPU renderer; st|mt"\|mask; 0x0|0x2|\|mask; 0x0|0x1|' libretro.cpp | grep -qx 3
          # retro_load_game also forces the threaded renderer after reading the options.
          sed -i 's/MDFNI_SetSetting("snes_faust.renderer", "mt");/MDFNI_SetSetting("snes_faust.renderer", "st");/' libretro.cpp
          grep -q 'MDFNI_SetSetting("snes_faust.renderer", "st");' libretro.cpp
          # The EmulatorJS threaded variant passes EMULATORJS_THREADS=1; compile with -pthread then.
          sed -i 's|^   TARGET := $(TARGET_NAME)_libretro_$(platform).bc$|&\n   ifeq ($(EMULATORJS_THREADS),1)\n      FLAGS += -pthread\n   endif|' Makefile
          grep -q EMULATORJS_THREADS Makefile
          # build.sh packs <core name>-wasm.data, so the output must be named after the core.
          sed -i 's/^TARGET_NAME := mednafen_supafaust$/TARGET_NAME := supafaust/' Makefile
          grep -qx 'TARGET_NAME := supafaust' Makefile
      - name: Build ${{ matrix.core }}
        working-directory: ejs-build
        # build.sh exits 0 even when the core fails to compile, so check for its output.
        run: |
          bash build.sh --core=${{ matrix.core }}
          ls -la output/*-wasm.data
      - name: Show build log on failure
        if: failure()
        run: tail -n 200 ejs-build/output/logs/* 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.core }}-${{ inputs.emsdk || '3.1.74' }}-${{ inputs.retroarch || 'a61f8a8905' }}
          path: |
            ejs-build/output/*.data
            ejs-build/output/reports/*.json

  publish:
    needs: build
    if: always() && inputs.publish != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: built
      - name: Commit cores
        run: |
          mkdir -p cores/dist/reports
          find built -name '*-wasm.data' ! -name '*-thread-*' -exec cp {} cores/dist/ \;
          find built -path '*reports*' -name '*.json' -exec cp {} cores/dist/reports/ \;
          ls -la cores/dist cores/dist/reports
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cores/dist
          git commit -m "Build GPL cores (run ${{ github.run_number }})" || { echo "nothing to commit"; exit 0; }
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
